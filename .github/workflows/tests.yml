name: ALBEDO CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: PHP syntax check (all app, config, database files)
        run: |
          status=0
          while IFS= read -r f; do
            php -l "$f" || status=1
          done < <(find app config database -name '*.php')
          exit $status

      - name: Verify migrations and seeders present
        run: |
          test -f database/seeders/CountySeeder.php
          count=$(ls database/migrations/*.php | wc -l)
          test "$count" -eq 8

      - name: Verify referenced models/services exist
        run: |
          for f in CarbonCalculator AdditionalityAssessor LeakageCalculator KncrReportGenerator; do
            test -f "app/Services/$f.php"
          done
          for m in County Fleet Vehicle CarbonCalculation CarbonCreditPrice GridFactor KncrSubmission ChargingStation; do
            test -f "app/Models/$m.php"
          done
